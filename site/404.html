<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f4f5f2" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111311" media="(prefers-color-scheme: dark)">
    <title>Page not found - Batuhan Cakir</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
      } catch {}
    </script>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/">BC</a>
    </header>

    <main class="not-found">
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p class="lede">This page doesn't exist or has moved.</p>
      <a class="contact-link" href="/">Back to home</a>
    </main>
  </body>
</html>
